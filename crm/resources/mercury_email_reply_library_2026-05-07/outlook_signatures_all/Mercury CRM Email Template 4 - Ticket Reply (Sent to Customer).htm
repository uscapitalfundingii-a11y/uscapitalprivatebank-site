<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>CRM Email Template 4 - Ticket Reply (Sent to Customer)</title></head><body style="font-family: Calibri, Arial, sans-serif; font-size: 11pt; color: #1f1f1f;">
<p>Hi {contact_firstname} {contact_lastname}</p>
<p>You have a new ticket reply to ticket #{ticket_id}</p>
<p>Ticket Subject: {ticket_subject}</p>
<p>Ticket message:<br>{ticket_message}</p>
<p>You can view the ticket on the following link: #{ticket_id}</p>
<p>Kind Regards,<br>{email_signature}</p>
</body></html>
