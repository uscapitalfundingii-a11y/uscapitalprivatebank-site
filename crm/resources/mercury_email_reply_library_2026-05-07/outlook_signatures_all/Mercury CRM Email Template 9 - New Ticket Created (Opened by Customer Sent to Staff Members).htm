<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>CRM Email Template 9 - New Ticket Created (Opened by Customer, Sent to Staff Members)</title></head><body style="font-family: Calibri, Arial, sans-serif; font-size: 11pt; color: #1f1f1f;">
<p>A new support ticket has been opened.</p>
<p>Subject: {ticket_subject}<br>Department: {ticket_department}<br>Priority: {ticket_priority}</p>
<p>Ticket message:<br>{ticket_message}</p>
<p>You can view the ticket on the following link: #{ticket_id}<br>Kind Regards,<br>{email_signature}</p>
</body></html>
